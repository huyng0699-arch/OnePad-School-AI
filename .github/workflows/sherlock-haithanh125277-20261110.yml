name: Sherlock scan haithanh125277
on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/sherlock-haithanh125277-20261110.yml

permissions:
  contents: read

jobs:
  scan:
    if: github.head_ref == 'experiment/sherlock-haithanh125277-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone original Sherlock repository
        run: |
          git clone --depth 1 https://github.com/sherlock-project/sherlock.git sherlock-upstream
          git -C sherlock-upstream log -1 --format="Upstream commit: %H"
      - name: Install original Sherlock
        run: |
          python -m pip install --no-input ./sherlock-upstream
          sherlock --version
      - name: Search username
        shell: bash
        run: |
          mkdir -p results
          set -o pipefail
          sherlock haithanh125277 --timeout 12 --print-found --no-color --txt --folderoutput results 2>&1 | tee sherlock-scan.log
          echo '====== Raw results ======'
          find results -maxdepth 1 -type f -print -exec cat {} \;
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-haithanh125277-results
          path: |
            sherlock-scan.log
            results/
          if-no-files-found: warn
          retention-days: 2
